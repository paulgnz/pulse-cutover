name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the tag it corresponds to is in the comment); Dependabot
# (.github/dependabot.yml) proposes bumps. A mutable tag could be moved to run other code with this
# workflow's token.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)
      - name: Build
        run: cargo build --locked
      - name: Tests (state machine, doctor, verify, scan, upstream mode)
        run: cargo test --locked

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n cutover.sh
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: Node syntax (edge, federator, tools, conformance harness)
        run: for f in $(git ls-files 'gateway/*.js' 'federator/*.js' 'examples/*.mjs' 'tools/*.mjs' 'tools/conformance/*.mjs' 'tools/conformance/clients/*.mjs'); do node --check "$f"; done
      - name: Example manifest is valid JSON
        run: jq -e . examples/ceremony.json >/dev/null
      - name: Edge + federator + mission control + conformance tests (node:test, mock upstreams, no network)
        run: node --test control/test/*.test.mjs gateway/test/*.test.mjs federator/test/*.test.mjs tools/conformance/test/*.test.mjs
      - name: Installer unit tests
        run: bash tools/test/run.sh
      - name: Native /v1/chain pass-through (extracted from install.sh)
        run: |
          awk "/cat > \/opt\/pulse-gateway\/server.js <<'JS'/{f=1;next} /^JS$/{f=0} f" install.sh > native.js
          node --check native.js
          node -e "require('http').createServer((q,r)=>{r.writeHead(200,{'content-type':'application/json'});r.end(JSON.stringify({path:q.url,host:q.headers.host}))}).listen(19650,'127.0.0.1')" &
          NATIVE_BASE=http://127.0.0.1:19650/ext/bc/TESTBID PORT=18899 node native.js &
          sleep 1
          out=$(curl -s -X POST http://127.0.0.1:18899/v1/chain/get_info -d '{}')
          echo "$out"
          echo "$out" | grep -q '"path":"/ext/bc/TESTBID/v1/chain/get_info"'
          echo "$out" | grep -q '"host":"localhost"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18899/rpc)" = 404
