[package]
name = "pulse-cutover"
version = "0.5.0-rc.19"
edition = "2021"
description = "Programmatic zero-read-downtime XPR -> PulseVM cutover ceremony agent"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
wasmparser = "0.245"
# Packing the source cut block for the upstream boot manifest (signature base58 + checksum).
bs58 = "0.5"
ripemd = "0.1"
# Producer signing-key preflight: derive the public key of the chain config's producer_key.
secp256k1 = "0.30"

# Linked PulseVM crates: only the snapshot reader (scan-contracts) and the
# interim fork importer (import_backend = "fork") use them. Pinned to an exact
# commit of the fork branch, which predates PulseVM's move from MIT to the
# PulseVM Business License (2026-09-24), so this MIT crate links MIT code.
# The official path (import_backend = "upstream") links nothing from PulseVM:
# it drives upstream's own current tools (export.sh, xpr_import_check,
# xpr_19_table_compare, xpr_state_fingerprint) as external programs.
pulsevm_snapshot = { git = "https://github.com/paulgnz/pulsevm", rev = "8a81171e5c549a433d9929829a319457c95f74dd" }
pulsevm_snapshot_import = { git = "https://github.com/paulgnz/pulsevm", rev = "8a81171e5c549a433d9929829a319457c95f74dd" }
pulsevm_chaindb = { git = "https://github.com/paulgnz/pulsevm", rev = "8a81171e5c549a433d9929829a319457c95f74dd" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = true
