[package]
name = "pulse-cutover"
version = "0.3.0"
edition = "2021"
description = "Programmatic zero-read-downtime XPR -> PulseVM cutover ceremony agent"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
wasmparser = "0.245"

# The snapshot/fingerprint stack, straight from the arena-import workspace.
# Convention: pulse-cutover and pulsevm-arena-import are sibling checkouts
# (~/dev/... on dev boxes, /root/... on servers).
pulsevm_snapshot = { git = "https://github.com/paulgnz/pulsevm", branch = "feat/arena-snapshot-import" }
pulsevm_snapshot_import = { git = "https://github.com/paulgnz/pulsevm", branch = "feat/arena-snapshot-import" }
pulsevm_chaindb = { git = "https://github.com/paulgnz/pulsevm", branch = "feat/arena-snapshot-import" }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = true
