# pulse-cutover HAProxy live-test fixture (examples/haproxy-test/).
#
# Deploy on a rehearsal box (never production):
#   sudo mkdir -p /etc/haproxy /run/haproxy
#   sudo cp haproxy.cfg /etc/haproxy/haproxy.cfg
#   sudo docker compose -f compose.yml up -d
#
# This file is BOTH the config the containerized haproxy runs with (bind-
# mounted read-only) AND the file doctor parses / install.sh edits on the
# host — the same dual view a native haproxy install has, so the whole
# haproxy code path (detect -> parse -> stage -> socket flip -> revert) is
# exercised for real without installing haproxy on the box.

global
    log stdout format raw local0
    # `level admin` on a UNIX socket is what selects pulse-cutover's
    # preferred flip strategy: transactional enable/disable server via the
    # runtime socket, zero reloads at ceremony time.
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Alternate-port frontend so the box's real nginx stays untouched (:8081 —
# rehearsal boxes often already use :8080 for a managed nginx layout).
frontend fe_pulse_test
    bind *:8081
    acl is_v1 path_beg /v1
    use_backend be_v1 if is_v1
    default_backend be_v1

backend be_v1
    # The box's source nodeos. install.sh stages
    #   server pulsevm-gw 127.0.0.1:8899 check disabled ...
    # next to this line at install time (one reload, days before the event);
    # the ceremony flip then swaps which of the two servers is live.
    server nodeos 127.0.0.1:8888 check
