# =============================================================================
# REFERENCE config — every knob of the ceremony agent in one file, in the
# original single-node/rehearsal shape (producer mode, pause_at_h).
#
# Start from the mode-specific examples instead:
#   ceremony-api.toml      API provider (public /v1 continuity)  — fully commented
#   ceremony-bp.toml       block producer (freeze + produce the new chain)
#   ceremony-hyperion.toml API provider + /v2 history continuity
#
# In a real multi-operator event the [ceremony] block is declared by msig on
# the source chain and this file is generated from that on-chain row; with
# install.sh it is generated from ceremony.json. Jargon → README glossary:
# https://github.com/paulgnz/pulse-cutover#glossary
# =============================================================================

journal_path = "/root/cutover-rehearsal/journal.jsonl"  # evidence log; a re-run resumes from it
poll_ms = 250                                           # chain poll interval, ms

[ceremony]
# The block where the old chain stops accepting writes. The agent freezes as
# soon as head >= this. (Or set freeze_margin to derive it at start.)
freeze_height = 12345

# Pin the chain being migrated; the agent refuses a node serving anything
# else. If omitted, the discovered chain_id is journaled instead.
# chain_id = "71ee83bc..."

# CPU-billing conversion between engines — part of chain identity; must
# match the staged PulseVM chain config exactly.
import_cpu_scale = 143

# How the freeze happens:
#   "pause_at_h"    pause the producer when head reaches H, snapshot after
#                   (single-node rehearsals)
#   "schedule_at_h" pre-order the snapshot at exactly block H from nodeos
#                   (multi-BP ceremonies — everyone cuts the same block)
freeze_strategy = "pause_at_h"

# After pausing: the head must hold still for this many consecutive polls
# before the cut is trusted (late blocks are detected and absorbed).
quiescence_polls = 6

[source]
rpc_url = "http://127.0.0.1:8888"            # your nodeos chain API
producer_api_url = "http://127.0.0.1:8888"   # pause/snapshot API — keep on 127.0.0.1 ONLY
snapshot_timeout_secs = 600                  # max wait for the snapshot write

[snapshot]
# Where the VERIFIED snapshot is staged for PulseVM to boot from. Must match
# the PulseVM chain config's snapshot_path, and must NOT exist beforehand
# (a stale file would pin the new chain to an old cut — preflight refuses).
staged_path = "/root/cutover-rehearsal/snapshot-cut.bin"

# docker nodeos: it reports snapshot paths inside the container; map them to
# where the same files appear on the host.
path_map_from = "/data/snapshots"
path_map_to = "/root/cutover-rehearsal/nodeos-data/snapshots"

# Multi-operator event: verify this box computes EXACTLY the published state
# fingerprints (abort on any difference):
# expected_sha256 = "..."                                # whole-file hash of the snapshot
# golden_roots = "/root/cutover-rehearsal/golden-roots.txt"
# First node / rehearsal: capture the fingerprints (with provenance) instead:
capture_roots = "/root/cutover-rehearsal/captured-roots.txt"

[target]
metalgo_unit = "metalgo-cutover"     # systemd unit of the PulseVM node
rpc_url = "http://127.0.0.1:9652/ext/bc/CHAIN_ID_HERE/rpc"   # the new chain's local RPC
live_blocks = 1                      # LIVE = head at least this far past the cut
quorum_timeout_secs = 600            # new chain not up in time -> abort + rollback
auto_rollback = true                 # on abort: resume the source producer

[hooks]
# Optional shell commands at key moments. on_freeze is where a real API edge
# starts rejecting writes (reads continue); on_abort should undo it.
on_freeze = "/root/cutover-rehearsal/freeze-writes.sh"
post_ignite = "/root/cutover-rehearsal/repoint-traffic.sh"
on_live = "echo 'flip gateway upstreams here'"
on_abort = "echo 'page the operator'"
