# =============================================================================
# BP (block-producer) mode rehearsal config
#
# Who this is for: a producer who helps FREEZE the chain at the agreed block
# and becomes a producer/validator of the migrated chain. Nothing public
# flips in this mode — your job is the freeze, the snapshot at exactly H,
# and igniting the new chain.
#
# The ceremony order in this mode:
#   ARMED        watch the chain approach H (snapshot pre-scheduled at exactly H)
#   FROZEN       writes are frozen at the API edge; empty blocks carry the
#                chain until H is final; nodeos writes snapshot-<id-of-H>.bin
#   SNAPSHOTTED  producer paused, chain quiet, cut pinned to H by block id
#   VERIFIED     snapshot hashed + imported twice, fingerprints checked
#   IGNITED      PulseVM boots the same chain at the cut
#   LIVE         the new chain is producing past the cut
#
# Jargon (H, the cut, goldens, quiescence...) → README glossary:
# https://github.com/paulgnz/pulse-cutover#glossary
#
# SINGLE-NODE REHEARSAL NOTES (this file rehearses against a live-syncing
# replica of a chain you do NOT control, which is why some knobs look odd):
# - freeze_margin must exceed the chain's head-to-final lag (~330 blocks on
#   XPR testnet), because a producer freezes at head >= H while H itself is
#   derived from the last FINAL block — hence 420 here.
# - quiesce_cmd cuts the replica's p2p to fake "every producer paused"; a
#   real multi-BP ceremony does not need it (nobody produces after the pause).
# - the burn-off audit (transactions between the cut and the pause) will show
#   REAL transactions here because the live chain kept going; in a real
#   freeze those blocks are empty and the audit proves it.
# =============================================================================

journal_path = "/root/bp-cutover/journal.jsonl"   # evidence log; resumable   [CHANGE to your work dir]
poll_ms = 250                                     # poll interval, ms          [LEAVE]

[ceremony]
rehearsal = true             # REHEARSAL config: relaxes the production profile (see README "Production profile");
                             # a real cut drops this line and must load without it. Refused for XPR mainnet.
mode = "producer"            # you are a BP                                    [LEAVE]
freeze_height = 0            # real event: H comes from the signed event (`await`) or is typed here  [CHANGE per event]
freeze_margin = 420          # rehearsal H = last-final + 420 (see note above) [LEAVE for rehearsals;
derive_h_at_arm = true       # rehearsal only: H derived at arm                 DELETE both for `await`]

# "schedule_at_h" = tell nodeos IN ADVANCE to write the snapshot the moment
# block H becomes final — the multi-BP discipline (everyone cuts the exact
# same block). "pause_at_h" = pause first, snapshot after (single-node).      [LEAVE]
freeze_strategy = "schedule_at_h"

# Close writes this many blocks BEFORE H (the cut stays exactly H) so
# transactions already accepted or in flight on p2p land at or before the
# cut. Freezing AT H leaked in-flight transfers into H+1 on every producer
# in the 5-BP rehearsal (the burn-off audit caught it and aborted). [LEAVE]
freeze_lead_blocks = 24
# rc.32: at the freeze the producer itself refuses every transaction (subjective actor whitelist = an
# impossible account), so nothing queued before the freeze can land after H whatever its expiry. Default true.
admission_lock = true

# After pausing, the chain's head must hold still for this many consecutive
# polls before the cut is trusted (catches stragglers/late blocks).           [LEAVE]
quiescence_polls = 8
quiescence_timeout_secs = 120   # abort if the source never stops producing after the pause

chain_id = "71ee83bcf52142d61019d95f9cc5427ba6a0d7ff8accd9e2088ae2abeaf3d3dd"  # XPR testnet  [CHANGE to your chain]
import_cpu_scale = 143       # same number for every operator — coordinator sets it  [LEAVE]

[source]
rpc_url = "http://127.0.0.1:8888"            # your nodeos chain API           [CHANGE if not :8888]
producer_api_url = "http://127.0.0.1:8888"   # pause/snapshot API — 127.0.0.1 ONLY, never public  [CHANGE if not :8888]
snapshot_timeout_secs = 900                  # max wait for snapshot write     [LEAVE unless huge state]

# Rehearsal-only stand-in for "every other producer also paused": severs the
# replica's p2p so the head actually stops. Real multi-BP event: delete.      [LEAVE for rehearsals]
quiesce_cmd = "/root/bp-cutover/quiesce.sh"

[snapshot]
# Where the VERIFIED snapshot is staged for PulseVM (must match the PulseVM
# chain config's snapshot_path; must NOT pre-exist).                          [LEAVE]
staged_path = "/root/api-cutover/loop/snapshot-cut.bin"

# Where nodeos writes its scheduled snapshot files (schedule_at_h picks up
# snapshot-<block-id-of-H>.bin from here by exact name).                      [CHANGE to your nodeos snapshots dir]
dir = "/root/nodeos/data/snapshots"

# docker nodeos: container path -> host path for the same directory.
path_map_from = "/data/snapshots"
path_map_to = "/root/nodeos/data/snapshots"

# Rehearsal: write the computed state fingerprints here. Real event: use
# golden_roots = "<published golden file>" instead — verify, don't capture.   [CHANGE per event]
capture_roots = "/root/bp-cutover/captured-roots.txt"

[target]
# stop_cmd = "systemctl stop metalgo-pulse && ! systemctl is-active --quiet metalgo-pulse"
#   Local fence for `pulse-cutover rollback --force-after-ignite` (coordinator's fleet-wide order only):
#   stops THIS box's target before the source is resumed. Default = stop metalgo_unit as above. Set it
#   if the target runs elsewhere or under another supervisor. Runs under hooks.timeout_secs.
metalgo_unit = "metalgo-local"        # the PulseVM node's systemd unit        [LEAVE — installer sets it]
rpc_url = "http://127.0.0.1:9657/"    # the new chain's local RPC              [installer fills this]
live_blocks = 1                       # LIVE = head at least this far past the cut (proof the new chain really produces)  [LEAVE]
quorum_timeout_secs = 900             # new chain not up in time -> abort + rollback  [LEAVE]
auto_rollback = true                  # on abort: resume the source producer automatically  [LEAVE]

[hooks]
# on_freeze runs the moment the freeze begins — in a real event this is where
# YOUR API edge starts rejecting writes (R2: reads continue, writes reject).
on_freeze = "echo bp-write-freeze-marker"
# on_abort: undo anything on_freeze/quiesce did (here: restore the replica's p2p).
on_abort = "/root/bp-cutover/unquiesce.sh"
# A real event also needs post_ignite (first transactions: PulseVM builds blocks
# on demand) and on_live (flip your API edge); the production profile requires
# all four. on_halt pages a human when the ceremony seals; timeout_secs (300)
# bounds every hook.

# -----------------------------------------------------------------------------
# [beacon] — reports readiness + evidence to Cutover Mission Control. Needed
# by every COORDINATED producer: the fleet gate and the resume guard only count
# nodes whose reports the relay can see, and `producer` must be in the event's
# roster (the config warns when it is not). The url/token/instance come from
# tools/beacon-install.sh; put the same producer here.            [CHANGE producer/network]
# -----------------------------------------------------------------------------
[beacon]
url = "https://control.example/api/report"   # https only (plain http only to localhost)
producer = "youraccount"            # your account as in the producer schedule AND the event roster
network = "testnet"                 # mission control's network id (networks.json)
node = "producer"                   # this server's label on the board (default: hostname); one per server
role = "producer"                   # producer | api | history | seed
token_file = "/etc/pulse-cutover/beacon.token"   # one line, mode 600; never the token itself here
interval_secs = 5

# -----------------------------------------------------------------------------
# [coordination] — `pulse-cutover await`: arm from the coordinator's SIGNED
# event instead of a typed H (every producer gets the same H, roster and
# quorum), and gate ignition on the fleet. With this section, freeze_height
# stays 0 and freeze_margin/derive_h_at_arm are removed: H comes from the event.
# `await` writes a DERIVED config with H, event_id, event_hash and the event's
# roster/quorum; `run` uses that one. Every field: examples/ceremony.toml.
# -----------------------------------------------------------------------------
[coordination]
url = "https://control.example"   # relay base URL (signed messages + beacon reports)
network = "testnet"
coordinator_keys = ["REPLACE-WITH-THE-COORDINATOR-ED25519-PUBLIC-KEY-HEX"]   # empty = trust nobody  [CHANGE]
auto_arm = false                    # a signed ARM also needs `touch <journal dir>/confirm-<event_id>`
min_lead_blocks = 120               # refuse an event whose H is closer than this to head
fleet_quorum = 0                    # the signed event's roster + quorum override this at `await`; a typed-in
                                    # roster (below) needs an explicit 1..=roster size
fleet_timeout_secs = 900   # >= 1.5 x the slowest roster member's drill conversion time (rc.32 default 900)
report_max_age_secs = 60
degraded_patience_secs = 900        # after ignition: a local symptom is waited out this long while a quorum
degraded_retry_secs = 10            # reports the same target chain (hooks retried with backoff)
fleet_stall_secs = 300
# Normally written by `await` from the signed event, not by hand:
# event_id = "..."
# event_hash = "..."               # rc.29: the relay's "no abort" must carry this signed event
# [[coordination.roster]]
# producer = "bp1"
# instance_id = "<32-hex beacon.instance>"   # optional: pin the member to one beacon instance
