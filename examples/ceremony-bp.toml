# bp-mode (producer) ceremony — the Appendix-A order, on real-chain state:
#
#   ARMED (snapshot scheduled at exactly H)
#   -> FROZEN  (writes frozen at the API edge; blocks keep coming so H can
#               finalize — R1; snapshot lands as snapshot-<id(H)>.bin)
#   -> SNAPSHOTTED (pause + quiesce + quiescence window; cut pinned to H)
#   -> VERIFIED -> IGNITED -> LIVE (this node now PRODUCES the new chain)
#
# Single-node stand-in notes (rehearsing against a live-syncing replica):
# - freeze_strategy = "schedule_at_h": on a chain this node does not produce,
#   H finalizes on its own; a real BP freeze produces empty blocks to the
#   same effect (R1/R17 — same finality wait either way).
# - quiesce_cmd emulates "every producer paused" by severing p2p; a real
#   multi-BP ceremony needs no such hook (nobody produces after the pause).
# - burn-off audit over (H, head-at-pause] will show REAL transactions here
#   (the live chain kept going); in a real freeze those blocks are empty and
#   the audit proves it.

journal_path = "/root/bp-cutover/journal.jsonl"
poll_ms = 250

[ceremony]
mode = "producer"
freeze_height = 0
freeze_margin = 240
freeze_strategy = "schedule_at_h"
quiescence_polls = 8
chain_id = "71ee83bcf52142d61019d95f9cc5427ba6a0d7ff8accd9e2088ae2abeaf3d3dd"
import_cpu_scale = 143

[source]
rpc_url = "http://127.0.0.1:8888"
producer_api_url = "http://127.0.0.1:8888"
snapshot_timeout_secs = 900
quiesce_cmd = "/root/bp-cutover/quiesce.sh"

[snapshot]
# Local-network target substrate (same as the loop harness): the fresh local
# chain's config points at the loop's staged path.
staged_path = "/root/api-cutover/loop/snapshot-cut.bin"
dir = "/root/nodeos/data/snapshots"
path_map_from = "/data/snapshots"
path_map_to = "/root/nodeos/data/snapshots"
capture_roots = "/root/bp-cutover/captured-roots.txt"

[target]
metalgo_unit = "metalgo-local"
rpc_url = "http://127.0.0.1:9657/"
live_blocks = 1
quorum_timeout_secs = 900
auto_rollback = true

[hooks]
on_freeze = "echo bp-write-freeze-marker"
on_abort = "/root/bp-cutover/unquiesce.sh"
