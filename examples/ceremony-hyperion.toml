# =============================================================================
# HYPERION mode rehearsal config — api mode + the [hyperion] block.
#
# Who this is for: an API provider who ALSO serves /v2 history (Hyperion).
# Everything the api ceremony does, plus: your public /v2 URL keeps answering
# across the migration — old rows from the legacy archive, new rows from a
# local indexer on the new chain, merged behind the same URL ("the URL keeps
# its memory"). /v1 and /v2 flip together, in one user-visible moment.
#
# Ceremony order:
#   ARMED -> FROZEN -> SNAPSHOTTED -> VERIFIED -> IGNITED
#         -> (new-chain indexer up + caught up, boundary written)  <- still abortable
#         -> FLIPPED (/v1 -> PulseVM gateway, /v2 -> federating router)
#         -> LIVE (your nodeos stopped LAST; both public gates re-checked)
#
# Only the [hyperion] block is new — every other field is documented in
# examples/ceremony-api.toml. Jargon → README glossary.
# =============================================================================

journal_path = "/root/api-cutover/hyperion/journal.jsonl"   # [CHANGE to your work dir]
poll_ms = 250                                               # [LEAVE]

[ceremony]
mode = "api"                     # hyperion mode IS api mode + [hyperion]      [LEAVE]
freeze_height = 0                # real event: coordinator's H                 [CHANGE per event]
freeze_margin = 240              # rehearsal H = last-final + 240              [LEAVE for rehearsals]
simulate_freeze = true           # rehearsing against a live chain             [LEAVE for rehearsals]
chain_id = "71ee83bcf52142d61019d95f9cc5427ba6a0d7ff8accd9e2088ae2abeaf3d3dd"  # [CHANGE to your chain]
import_cpu_scale = 143           # coordinator-set, same for everyone          [LEAVE]

[source]
rpc_url = "http://127.0.0.1:8888"            # [CHANGE if not :8888]
producer_api_url = "http://127.0.0.1:8888"   # 127.0.0.1 ONLY — never public   [CHANGE if not :8888]
snapshot_timeout_secs = 900                  # [LEAVE unless huge state]
stop_cmd = "systemctl stop nodeos"           # YOUR stop command, runs LAST    [CHANGE to your command]
start_cmd = "systemctl start nodeos"         # rollback path                   [CHANGE to your command]

[snapshot]
staged_path = "/root/api-cutover/hyperion/snapshot-cut.bin"     # must NOT pre-exist  [LEAVE]
path_map_from = "/data/snapshots"                               # docker nodeos path map
path_map_to = "/root/nodeos/data/snapshots"
capture_roots = "/root/api-cutover/hyperion/captured-roots.txt" # rehearsal: capture; real event: golden_roots  [CHANGE per event]

[target]
metalgo_unit = "metalgo-pulse"                                  # [LEAVE]
rpc_url = "http://127.0.0.1:9650/ext/bc/<blockchainID>/rpc"     # [installer fills this]
quorum_timeout_secs = 900                                       # [LEAVE]
auto_rollback = true                                            # [LEAVE]

[flip]
cmd = "/opt/pulse-cutover/flip-to-pulsevm.sh"      # generated from YOUR nginx  [LEAVE]
public_url = "http://<public-ip-or-domain>"        # what users call            [CHANGE]
revert_cmd = "/opt/pulse-cutover/flip-revert.sh"   # the undo                   [LEAVE]
health_polls = 4                                   # [LEAVE]
head_tolerance = 8                                 # [LEAVE]
health_timeout_secs = 180                          # [LEAVE]

# ---------------------------------------------------------------------------
# [hyperion] — the /v2 history half. The pieces (hyperion-rs indexer,
# Elasticsearch, federating router) are staged by install.sh; the ceremony
# starts the indexer only AFTER the new chain exists.
# ---------------------------------------------------------------------------
[hyperion]
# Started after IGNITED. The agent substitutes {first_post_cut_block} — the
# indexer on a migrated chain MUST start at cut+1: asking for block 1 would
# wait forever for blocks the new chain doesn't have.                          [LEAVE]
start_cmd = "/opt/pulse-cutover/hyperion-start.sh {first_post_cut_block}"

# Local health endpoint of the new-chain indexer. The ceremony holds here
# until it reports caught-up (a chain with zero post-cut blocks counts as
# caught up by definition).                                                    [LEAVE]
health_url = "http://127.0.0.1:7000/v2/health"
hydration_timeout_secs = 900     # indexer not caught up in time -> abort      [LEAVE]
max_lag_blocks = 0               # how far the indexer may trail the head      [LEAVE]

# The agent writes the cut (block, time, id, chain) here; the federating
# router re-reads it live — this file IS the old/new history boundary.         [LEAVE]
boundary_path = "/etc/pulse-cutover/boundary.json"

# The /v2 half of the flip: swap the public /v2 from your existing Hyperion
# to the federating router. Generated by install.sh from YOUR nginx.           [LEAVE]
flip_cmd = "/opt/pulse-cutover/flip-v2.sh"
revert_cmd = "/opt/pulse-cutover/flip-v2-revert.sh"

# Public /v2 health URL — checked AFTER the flip, before your nodeos may be
# stopped.                                                                     [CHANGE]
public_health_url = "http://<public-ip-or-domain>/v2/health"
